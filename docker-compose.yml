services:
  quickproxy:
    image: ghcr.io/woliubang256/aws-quickwork-2api:latest
    build:
      context: .
    container_name: quickproxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - quickwork-data:/data
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  quickwork-data:
